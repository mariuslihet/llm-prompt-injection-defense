[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mecha-security"
version = "0.2.0"
description = "Offline-first prompt injection defense research platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.148.0", "uvicorn==0.54.0", "pydantic==2.14.1",
  "httpx==0.28.1", "PyYAML==6.0.3", "starlette==1.3.1",
]

[project.optional-dependencies]
research = ["torch==2.14.1", "transformers==5.20.2", "peft==0.21.2", "trl==1.16.0", "datasets==5.1.0"]
telemetry = ["opentelemetry-sdk==1.45.1", "opentelemetry-exporter-otlp-proto-http==1.45.1"]
postgres = ["psycopg[binary]==3.3.6"]
multimodal = ["pypdf==6.21.2", "Pillow==13.0.0"]
signing = ["cryptography==50.0.2"]

[dependency-groups]
dev = ["pytest==9.1.1", "hypothesis==6.131.9", "pytest-cov==6.1.1", "ruff==0.11.9", "mypy==1.15.0", "types-PyYAML==6.0.12.20250516", "pre-commit==4.2.0", "pip-audit==2.9.0", "setuptools==84.1.0"]

[project.scripts]
mecha = "packages.cli:main"

[tool.setuptools.packages.find]
include = ["packages*", "lab*", "agents*", "eval*", "training*"]

[tool.setuptools.package-data]
"packages.policy" = ["*.yaml"]
"lab" = ["corpus/*.jsonl", "corpus/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
"lab/*" = ["S311"]
"eval/*" = ["S311"]
"training/*" = ["S311"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["packages/core", "packages/policy", "packages/ifc", "packages/sanitizers"]

[[tool.mypy.overrides]]
module = ["transformers", "transformers.*", "torch", "torch.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.coverage.run]
source = ["packages.core", "packages.policy", "packages.ifc", "packages.sanitizers"]

[tool.coverage.report]
fail_under = 85
show_missing = true
