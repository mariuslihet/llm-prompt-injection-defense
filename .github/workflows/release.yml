name: Build and attest release candidate
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
          python-version: '3.11'
      - run: uv sync --frozen
      - run: uv run pytest --cov && uv run mypy && uv run ruff check .
      - run: uv run mecha evaluate --output artifacts/release && uv run mecha gate artifacts/release.json
      - run: uv run pip-audit --skip-editable
      - run: uv build
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: 'dist/*'
      - uses: actions/upload-artifact@v7
        with:
          name: attested-release-candidate
          path: |
            dist/
            artifacts/
